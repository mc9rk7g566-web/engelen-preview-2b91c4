const KEY="site-gate-pw";
const dec=s=>{const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
async function unlock(pw){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:dec(DATA.s),iterations:DATA.n,hash:"SHA-256"},km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:dec(DATA.i)},key,dec(DATA.c));
  return new TextDecoder().decode(pt);
}
async function tryShow(pw){
  const html=await unlock(pw);
  document.open();document.write(html);document.close();
}
const saved=sessionStorage.getItem(KEY);
if(saved){tryShow(saved).catch(()=>sessionStorage.removeItem(KEY));}
const f=document.getElementById("f"),pw=document.getElementById("pw"),err=document.getElementById("err"),btn=document.getElementById("btn");
f.addEventListener("submit",async e=>{
  e.preventDefault();err.classList.remove("show");btn.disabled=true;btn.textContent="Bezig…";
  try{
    await tryShow(pw.value.trim());
    sessionStorage.setItem(KEY,pw.value.trim());
  }catch(_){
    err.textContent="Dat wachtwoord klopt niet.";err.classList.add("show");
    btn.disabled=false;btn.textContent="Openen";pw.value="";pw.focus();
  }
});
